services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gex_finance_test}
      POSTGRES_USER: ${POSTGRES_USER:-gex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gex_local_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-3001}:3001"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gex}:${POSTGRES_PASSWORD:-gex_local_password}@postgres:5432/${POSTGRES_DB:-gex_finance_test}
      JWT_SECRET: ${JWT_SECRET:-challenge_only_change_me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      APP_TODAY: ${APP_TODAY:-}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Sao_Paulo}
      API_PORT: ${API_PORT:-3001}
      WEB_URL: ${WEB_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
